name: Release APK

# Publishes an APK that a previous run already built, so the download happens
# on a runner instead of the author's (slow) link.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id that produced the android-arm64-release artifact
        required: true
      tag:
        description: Release tag
        required: true
      title:
        description: Release title (defaults to the tag)
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          sha=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          test -n "$sha"
          echo "TARGET_SHA=$sha" >> "$GITHUB_ENV"
      - name: Download the APK from that run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n android-arm64-release -D dist
          find dist -name '*.apk'
      - name: Name the asset
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' | head -n1)
          test -n "$apk"
          mv "$apk" "dist/dsh-go-${TAG}-arm64.apk"
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          title=${TITLE:-$TAG}
          gh release create "$TAG" dist/*.apk \
            -R "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$title" \
            --prerelease \
            --notes "APK built by [run ${RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}) from \`${TARGET_SHA}\`."
