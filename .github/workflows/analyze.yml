name: Flutter Analyze

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # The widget-test harness loads Noto Sans CJK from disk and fails the
      # whole file when it is missing; the runner image has no CJK fonts.
      - name: Fetch the CJK fonts the tests load
        run: |
          set -euo pipefail
          mkdir -p "$HOME/test-fonts"
          cd "$HOME/test-fonts"
          ( sudo apt-get update -q
            apt-get download fonts-noto-cjk
            for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
            find unpacked -name 'NotoSansCJK-*.ttc' -exec cp {} . \;
          ) || true
          if [ ! -f NotoSansCJK-Regular.ttc ]; then
            curl -fsSL --retry 3 -o otc.zip \
              https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/03_NotoSansCJK-OTC.zip
            unzip -q -o otc.zip -d otc
            find otc -name 'NotoSansCJK-*.ttc' -exec cp {} . \;
          fi
          for f in Regular Bold Light; do test -f "NotoSansCJK-$f.ttc"; done
          echo "DSH_TEST_FONT_DIR=$HOME/test-fonts" >> "$GITHUB_ENV"
      - name: Test the systemd service layer
        run: flutter test --no-pub test/remote/dsh_service_test.dart
      # Keeps lib/l10n/gen in step with the ARB inputs. Regenerating needs
      # Flutter, which the author's machine does not have, so the canonical
      # output rides along as an artifact for a manual commit.
      - name: Regenerate the localization
        run: python3 tool/l10n_merge.py
      - name: Keep the regenerated localization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l10n-gen
          path: app/lib/l10n/gen
          if-no-files-found: ignore
      - name: Generated localization matches its source
        if: always()
        run: git diff --exit-code -- lib/l10n
