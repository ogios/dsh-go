name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DSH_BETA_TOKEN_FILE: ''
      UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
      UBUNTU_ARCHIVE_AMD64: http://archive.ubuntu.com/ubuntu
      UBUNTU_ARCHIVE_ARM64: http://ports.ubuntu.com/ubuntu-ports
      NODE_MIRROR: https://nodejs.org/dist
      NPM_REGISTRY: https://registry.npmjs.org
      PBS_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # yes may receive SIGPIPE when sdkmanager finishes reading licenses.
          (yes || true) | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          # Flutter 3.47.7 supplies compileSdk/NDK; AGP 9.1.0 uses Build Tools 36.0.0.
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use upstream Gradle distribution
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' \
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Flutter
        run: |
          flutter config --no-analytics --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME"
          flutter precache --android
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get
          flutter gen-l10n

      - name: Build bundled runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates coreutils curl file findutils gpgv grep openssl procps python3 sed tar unzip xz-utils zstd
          bash runtime/build-runtime.sh arm64-v8a

      - name: Configure release signing when secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              'ANDROID_KEYSTORE_BASE64',
              'ANDROID_KEYSTORE_PASSWORD',
              'ANDROID_KEY_ALIAS',
              'ANDROID_KEY_PASSWORD',
          )
          if not all(os.environ.get(name) for name in names):
              print('Signing secrets incomplete or unavailable; using debug signing.')
              raise SystemExit(0)

          os.umask(0o077)
          keystore = Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))

          def escape(value):
              encoded = value.encode('utf-16-be')
              return ''.join(
                  f'\\u{int.from_bytes(encoded[i:i + 2], "big"):04x}'
                  for i in range(0, len(encoded), 2)
              )

          properties = {
              'storeFile': str(keystore),
              'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
          }
          Path('app/android/key.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in properties.items()),
              encoding='ascii',
          )
          PY

      - name: Build release APK
        run: bash tooling/build-apk.sh --release -f arm64 --keep-daemon

      - name: Remove signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/android-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
