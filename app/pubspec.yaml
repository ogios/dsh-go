name: dsh_app
description: "DSH — DeepSeek Harness on your phone"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# dsh-go: only the version name is kept here. `+1` is a placeholder: the
# versionCode is the build minute, stamped by tooling/build-apk.sh (see
# docs/release.md「构建号」). Don't bump it by hand.
version: 1.0.12+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # gen-l10n output (lib/l10n/gen) imports it; version pinned by flutter_localizations.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  gpt_markdown: ^1.4.0
  # gpt_markdown's own maths engine, used directly for the formula fallback.
  val_latex_flutter: ^0.1.3
  re_highlight: ^0.0.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  dsh_client:
    path: ../packages/dsh_client
  dsh_remote:
    path: ../packages/dsh_remote
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  dartssh2: ^4.1.0
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  crypto: ^3.0.7
  # AES-256-GCM for hosted conversation links (lib/share_hosted), the pure-Dart
  # implementation packages/dsh_remote already uses. Apache-2.0.
  cryptography: ^2.9.0
  # IANA rules for automation run-time previews (next runs in any time zone).
  timezone: ^0.11.2
  # Reads Agent preset compositions (agentPresets/read) for the preset editor.
  yaml: ^3.1.4
  # Terminal emulator (VT parser, screen buffer, renderer) for the conversation
  # terminal page. MIT.
  xterm: ^4.0.0
  # Forum (lib/forum): Discourse API calls (already a dependency of others),
  # the post HTML reader (dart-lang, BSD-3) and RSA for User API Keys
  # (already pulled in by dartssh2, MIT).
  http: ^1.6.0
  html: ^0.15.6
  pointycastle: ^4.0.0
  # WebRTC DataChannel for DSH Remote's direct (P2P / TURN) path; the transport
  # logic lives in packages/dsh_remote. MIT, bundles libwebrtc (BSD-3).
  flutter_webrtc: ^1.6.3
  archive: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # gen-l10n (l10n.yaml): lib/l10n/gen is regenerated by tool/l10n_merge.py.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # App icons: a Phosphor subset made by tool/make_icon_font.py; use AppIcons.
    - family: DshIcons
      fonts:
        - asset: assets/fonts/DshIcons.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  assets:
    # Full upstream WebRTC Android release notices, shown by LicenseRegistry.
    - assets/licenses/webrtc-150.7871.04.md
    # Phone layout for the embedded DSH Web (see lib/ui/web/web_view_page.dart).
    - assets/web/
    # Whale-tail activity sprites (lib/ui/chat/widgets/whale_tail.dart),
    # generated by tool/make_whale_sprites.py.
    - assets/whale/
    # Engine-side auth bridge (ChatGPT / Claude sign-in), copied into the guest at
    # every engine start by runtime/AppAuthGuest.kt; tests in tool/engine_auth/.
    - assets/engine/auth/
    # 社区 hub content shipped with the app (lib/state/community_state.dart),
    # shown until a newer community.json is fetched.
    - assets/community/
    # Glass-gradient feature tiles (lib/ui/common/feature_tile.dart), 288px WebP.
    # The vector styles' SVG masters in assets/tiles/ are not bundled.
    - assets/tiles/glassy/
    - assets/pets/deepy-whale/
    - assets/pets/whale-girl/
    # The star prompt's whale girl (lib/ui/star/star_prompt_dialog.dart), 576px WebP.
    - assets/star/
    - assets/islands/
    # 伙伴小屋's page (lib/ui/companion). Its Live2D runtime and models are a
    # separate download, see docs/design/companion.md.
    - assets/companion/
    - assets/skills/dsh-go-ui/
    - assets/skills/dsh-go-plugin/
    - assets/skills/dsh-go-guide/
    - assets/skills/dsh-go-support/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
